<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EC復旧試験・セキュリティ確認のみ</title>
<style>body{font:18px/1.7 system-ui;max-width:720px;margin:35px auto;padding:20px;background:#f4f9f6;color:#203f31}main{background:white;padding:25px;border-radius:14px}button{padding:12px 20px;margin:16px 0;font:inherit}textarea{display:none}#status{padding:15px;background:#edf5ee}</style>
<script>function passed(token){document.getElementById('token').value=token;document.getElementById('status').textContent='確認できました。Codexに「確認済み」とお知らせください。';}function expired(){document.getElementById('token').value='';document.getElementById('status').textContent='確認の有効期限が切れました。「確認をやり直す」を押してください。';}function failed(){document.getElementById('token').value='';document.getElementById('status').textContent='確認が完了していません。「確認をやり直す」を押してください。';}</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main><h1>EC復旧試験</h1><p>この画面では、セキュリティ確認だけを行います。氏名・回答・署名の入力はなく、本番の受付先へは送信しません。</p>
<p>下のCloudflareの確認欄を操作してください。</p><div class="cf-turnstile" data-sitekey="0x4AAAAAADHkWVJdzrHtJBMm" data-theme="light" data-callback="passed" data-expired-callback="expired" data-error-callback="failed"></div>
<p id="status" role="status">セキュリティ確認を待っています。</p><textarea id="token" aria-label="試験専用の確認結果" readonly autocomplete="off"></textarea><button type="button" onclick="expired();turnstile.reset()">確認をやり直す</button><p>確認結果は、本人専用の空の試験環境で受付・保存・通知を確認するために使います。</p></main></body></html>
