<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EC復旧試験・本人確認とダミー送信</title>
<style>body{font:18px/1.7 system-ui;max-width:720px;margin:35px auto;padding:20px;background:#f4f9f6;color:#203f31}main{background:white;padding:25px;border-radius:14px}button{padding:14px 20px;margin:16px 0;font:inherit;background:#236c50;color:white;border:0;border-radius:8px}button:disabled{background:#778980}#status{padding:15px;background:#edf5ee}#widget{min-height:80px}</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script></head><body><main><h1>EC復旧試験</h1><p>本人確認が通ると、<strong>ダミー回答1件と試験用画像を専用の試験表に送信</strong>します。通知は tennsui.com@gmail.com 本人宛てだけです。</p><p>本番の受付表・印刷フォルダーは使用しません。氏名や署名の入力も不要です。</p>
<button id="start" type="button">確認を開始してダミー送信</button><div id="widget"></div><p id="status" role="status">ボタンを押すと本人確認が始まります。</p>
<form id="trialForm" method="post" action="https://script.google.com/macros/s/AKfycbxezxkAB166ez0_1J8FgFI1IO3M1VStjtkBlLmMbFk/dev"><input type="hidden" name="ecTrialPayload" id="payload"></form>
<p>送信後の結果に <strong>"success": true</strong> と表示されたら、Codexに「送信できた」とお知らせください。失敗時は再送せず、表示内容をお知らせください。</p></main>
<script>
let widgetId=null,submitting=false;
const start=document.getElementById('start'),statusBox=document.getElementById('status');
const rejectTest=new URLSearchParams(location.search).get('reject_test')==='1';
if(rejectTest)start.textContent='無効な認証の拒否を試験（保存なし）';
function waiting(){statusBox.textContent='確認欄を読み込んでいます。確認を求められた場合は、ご本人で操作してください。';start.disabled=true;}
function fail(message){if(submitting)return;statusBox.textContent=message;start.disabled=false;start.textContent='確認をやり直す';}
function pass(token){
 if(submitting)return;submitting=true;statusBox.textContent='確認できました。専用の試験表にダミー送信しています。画面が変わるまでお待ちください。';
 const c=document.createElement('canvas');c.width=500;c.height=130;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,500,130);x.fillStyle='black';x.font='28px sans-serif';x.fillText('DUMMY TEST 20261023',25,70);
 const data={name:'EC復旧試験_DUMMY_20261023',age:'o16',periodDate:'2026-10-01',periodCycle:'28日',periodAmt:'通常',sex3w:'no',sex3o:'no',sexWorry:'no',priorUse:false,nursing:false,japan:true,cautions:[],pregRisk:false,signature:c.toDataURL('image/png'),_ts:20000,cf_turnstile_token:token};
 document.getElementById('payload').value=JSON.stringify(data);document.getElementById('trialForm').submit();
}
start.addEventListener('click',function(){
 if(submitting)return;
 if(rejectTest){pass('EC_INVALID_DUMMY_TOKEN_20261023');return;}
 if(!window.turnstile){fail('確認用の読み込みが完了していません。ページを再読み込みしてから、このボタンを押してください。');return;}
 waiting();
 if(widgetId!==null){turnstile.reset(widgetId);return;}
 widgetId=turnstile.render('#widget',{sitekey:'0x4AAAAAADHkWVJdzrHtJBMm',theme:'light',appearance:'always',callback:pass,'expired-callback':()=>fail('確認の期限が切れました。「確認をやり直す」を押してください。'),'error-callback':()=>{fail('確認欄を読み込めませんでした。「確認をやり直す」を押すか、この表示をCodexにお知らせください。');return true;}});
});
</script></body></html>
